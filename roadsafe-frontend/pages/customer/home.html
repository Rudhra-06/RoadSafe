<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="RoadSafe customer dashboard — request roadside assistance fast.">
    <title>Home — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<main class="pwa-container">

    <!-- Header -->
    <header class="header">
        <span class="header-title">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:6px;vertical-align:middle;">
                <path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13V7m0 13l6-3m-6-10l6-3m0 13l5.447 2.724A1 1 0 0 0 21 19.382V8.618a1 1 0 0 0-.553-.894L15 5m0 12V5"/>
            </svg>
            RoadSafe
        </span>
        <a href="notifications.html" class="header-icon" aria-label="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg>
        </a>
    </header>

    <!-- Content -->
    <section class="content-body">

        <!-- Welcome Strip -->
        <div class="welcome-strip">
            <h2>Hello, <span id="userName">there</span></h2>
            <p>Ready to assist you on the road today.</p>
        </div>

        <!-- SOS Button -->
        <a href="request.html" class="btn btn-primary btn-hero" id="sosBtn" style="margin-bottom:20px;">
            <svg viewBox="0 0 24 24" style="width:32px;height:32px;stroke:#fff;fill:none;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            </svg>
            Request Assistance
        </a>

        <!-- Quick Actions -->
        <p class="section-title">Quick Actions</p>
        <div class="quick-grid">
            <a href="services.html" class="quick-card">
                <div class="quick-card-icon">
                    <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
                </div>
                <span class="quick-card-label">Services</span>
            </a>
            <a href="providers.html" class="quick-card">
                <div class="quick-card-icon">
                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <span class="quick-card-label">Nearby</span>
            </a>
            <a href="history.html" class="quick-card">
                <div class="quick-card-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                </div>
                <span class="quick-card-label">History</span>
            </a>
            <a href="tracking.html" class="quick-card">
                <div class="quick-card-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span class="quick-card-label">Track</span>
            </a>
        </div>

        <!-- Active Request Status -->
        <p class="section-title">Current Status</p>
        <div class="card" id="statusCard">
            <p id="currentStatusText" style="color:var(--text-secondary);font-size:.88rem;">No active requests right now.</p>
        </div>

    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">
        <a href="home.html" class="nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"/></svg>
            Home
        </a>
        <a href="request.html" class="nav-item" aria-label="Request help">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Assist
        </a>
        <a href="history.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            History
        </a>
        <a href="notifications.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg>
            Alerts
        </a>
        <a href="#" class="nav-item" id="logoutNavBtn" onclick="Auth.logout(); return false;" style="color:var(--danger-red);">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3m8-9h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Logout
        </a>
    </nav>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script>
    // Guard route
    Auth.guardRoute();

    // Show user name
    const user = Auth.getUser();
    if (user && user.full_name) {
        const first = user.full_name.split(' ')[0];
        document.getElementById('userName').textContent = first;
    }

    // Check for active ticket
    const activeId = localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
    if (activeId) {
        const sc = document.getElementById('statusCard');
        sc.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <strong>Active Request</strong>
                <span class="badge badge-info">In Progress</span>
            </div>
            <p style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px;">Ticket #${activeId.slice(0,8)}…</p>
            <a href="tracking.html" class="btn btn-secondary btn-inline" style="font-size:.88rem;padding:10px 16px;">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Track Request
            </a>`;
    }
</script>
</body>
</html>
