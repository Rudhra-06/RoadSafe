<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Request Assistance — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <main class="pwa-container no-bottom-nav">
        <header class="header">
            <a href="services.html" class="header-back" aria-label="Back">
                <svg class="icon" viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </a>
            <span class="header-title">Request Assistance</span>
            <span style="width:48px;"></span>
        </header>

        <section class="content-body">
            <div class="page-heading">
                <h1>Emergency &amp; Roadside Help</h1>
                <p>Confirm vehicle details and your current location for instant dispatch.</p>
            </div>

            <div id="message"></div>

            <form id="form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="service">Service Category <span
                            style="color:var(--danger-red);">*</span></label>
                    <select class="input-field" id="service"></select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="vehicle">Vehicle Make &amp; Model <span
                            style="color:var(--danger-red);">*</span></label>
                    <input class="input-field" id="vehicle" required placeholder="e.g. Maruti Swift / Hyundai Creta">
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Issue Summary <span
                            style="color:var(--danger-red);">*</span></label>
                    <textarea class="input-field" id="description" required minlength="5"
                        placeholder="Briefly describe what happened (e.g. flat tyre on highway side)..."
                        rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="priority">Urgency Level</label>
                    <select class="input-field" id="priority">
                        <option value="MEDIUM">Standard Roadside Assistance</option>
                        <option value="HIGH">Urgent (Blocked Traffic)</option>
                        <option value="EMERGENCY">Emergency (Safety Hazard)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="location">GPS Coordinates</label>
                    <input class="input-field" id="location" readonly style="background:#f1f5f9;">
                    <div id="map" style="height: 220px; border-radius: var(--radius-md, 8px); margin-top: 10px; border: 1px solid var(--border-light); z-index: 1;"></div>
                    <p class="muted" id="locationHelp" style="font-size:0.8rem; margin-top:4px;">Requesting device GPS coordinates…</p>
                </div>

                <button type="submit" class="btn btn-primary" disabled id="continue" style="margin-top:12px;">
                    <svg viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                    Review &amp; Confirm Request
                </button>
            </form>
        </section>
    </main>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/offline.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/ui.js"></script>
    <script>
        Auth.guardRoute();

        // DEV/TESTING FALLBACK: Used ONLY when browser geolocation fails
        const DEV_FALLBACK_COORDS = { latitude: 11.0168, longitude: 76.9558 };
        const ENABLE_DEV_FALLBACK = true;

        const id = new URLSearchParams(window.location.search).get('service_id');
        const sel = document.querySelector('#service');
        const msg = document.querySelector('#message');
        const formEl = document.querySelector('#form');
        const locationInput = document.querySelector('#location');
        const locationHelp = document.querySelector('#locationHelp');
        let coords = null;
        let isSimulated = false;
        let services = [];

        let leafMap = null;
        let leafMarker = null;

        const customerIcon = L.divIcon({
            className: 'custom-leaflet-marker customer-marker',
            html: `<div style="background:#0f766e; width:28px; height:28px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                   </div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        function renderMap(lat, lng) {
            if (!leafMap) {
                leafMap = L.map('map').setView([lat, lng], 14);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(leafMap);
                leafMarker = L.marker([lat, lng], { icon: customerIcon }).addTo(leafMap)
                    .bindPopup('<b>Your Request Location</b>').openPopup();
            } else {
                leafMap.setView([lat, lng], 14);
                leafMarker.setLatLng([lat, lng]);
            }
        }

        const type = s => /tow/i.test(s.category || s.name) ? 'TOWING_OPERATOR' : /bike/i.test(s.category || s.name) ? 'BIKE_MECHANIC' : /engine|tyre|tire|mechanic/i.test(s.category || s.name) ? 'CAR_MECHANIC' : 'ROADSIDE_TECHNICIAN';

        function applyLocation(loc, simulated) {
            coords = loc;
            isSimulated = simulated;
            if (coords) {
                locationInput.value = `${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`;
                locationHelp.textContent = isSimulated
                    ? 'Using simulated location (Coimbatore fallback for dev/testing).'
                    : 'Device GPS location verified.';
                document.querySelector('#continue').disabled = false;
                renderMap(coords.latitude, coords.longitude);
            } else {
                locationInput.value = '';
                locationHelp.textContent = 'Unable to determine location. Please enable GPS permissions.';
                document.querySelector('#continue').disabled = true;
            }
        }

        Promise.all([
            API.get('/services'),
            new Promise(done => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        p => {
                            applyLocation({ latitude: p.coords.latitude, longitude: p.coords.longitude }, false);
                            done();
                        },
                        () => {
                            if (ENABLE_DEV_FALLBACK) {
                                applyLocation(DEV_FALLBACK_COORDS, true);
                            } else {
                                applyLocation(null, false);
                            }
                            done();
                        }
                    );
                } else {
                    if (ENABLE_DEV_FALLBACK) {
                        applyLocation(DEV_FALLBACK_COORDS, true);
                    } else {
                        applyLocation(null, false);
                    }
                    done();
                }
            })
        ]).then(([items]) => {
            services = items;
            sel.innerHTML = items.map(s => `<option value="${s.id}">${UI.escape(s.name)} — ${Number(s.base_price).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</option>`).join('');
            if (id) sel.value = id;
        }).catch(() => UI.alert(msg, 'Services could not be loaded. Please retry.'));

        formEl.onsubmit = e => {
            e.preventDefault();
            const service = services.find(s => s.id === sel.value);
            sessionStorage.setItem('rs_request_draft', JSON.stringify({
                service,
                vehicle_type: document.querySelector('#vehicle').value,
                description: document.querySelector('#description').value,
                priority: document.querySelector('#priority').value,
                ...coords,
                service_type: type(service),
                contact_phone: Auth.getUser()?.phone_number || null
            }));
            window.location.href = 'confirm.html';
        };
    </script>
</body>

</html>
