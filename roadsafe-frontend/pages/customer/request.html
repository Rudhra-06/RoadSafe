<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request assistance</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="services.html">‹</a><span class="header-title">Request assistance</span></header><section class="content-body"><div class="page-heading"><h1>Confirm service and location</h1><p>We send this to the nearest available provider.</p></div><div id="message"></div><form id="form"><label>Service</label><select class="input-field" id="service"></select><label>Vehicle</label><input class="input-field" id="vehicle" required placeholder="e.g. 2021 Toyota Camry"><label>Issue details</label><textarea class="input-field" id="description" required minlength="5"></textarea><label>Priority</label><select class="input-field" id="priority"><option value="MEDIUM">Standard assistance</option><option value="HIGH">Urgent</option><option value="EMERGENCY">Emergency</option></select><label>Your location</label><input class="input-field" id="location" readonly><p class="muted" id="locationHelp">Requesting location…</p><button class="btn btn-primary" disabled id="continue">Review request</button></form></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>
const id=new URLSearchParams(window.location.search).get('service_id'),sel=document.querySelector('#service'),msg=document.querySelector('#message'),formEl=document.querySelector('#form'),locationInput=document.querySelector('#location');let coords,services=[];const type=s=>/tow/i.test(s.category||s.name)?'TOWING_OPERATOR':/bike/i.test(s.category||s.name)?'BIKE_MECHANIC':/engine|tyre|tire|mechanic/i.test(s.category||s.name)?'CAR_MECHANIC':'ROADSIDE_TECHNICIAN';Promise.all([API.get('/services'),new Promise(done=>navigator.geolocation.getCurrentPosition(p=>{coords={latitude:p.coords.latitude,longitude:p.coords.longitude};done()},done))]).then(([items])=>{services=items;sel.innerHTML=items.map(s=>`<option value="${s.id}">${UI.escape(s.name)}</option>`).join('');if(id)sel.value=id;if(coords){locationInput.value=`${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}`;document.querySelector('#locationHelp').textContent='Location captured.';document.querySelector('#continue').disabled=false}else{document.querySelector('#locationHelp').textContent='Location permission is required.';UI.alert(msg,'Enable device location to request roadside help.')}}).catch(()=>UI.alert(msg,'Services could not be loaded. Please retry.'));formEl.onsubmit=e=>{e.preventDefault();const service=services.find(s=>s.id===sel.value);sessionStorage.setItem('rs_request_draft',JSON.stringify({service,vehicle_type:document.querySelector('#vehicle').value,description:document.querySelector('#description').value,priority:document.querySelector('#priority').value,...coords,service_type:type(service),contact_phone:Auth.getUser()?.phone_number||null}));window.location.href='confirm.html'};
</script></body></html>
