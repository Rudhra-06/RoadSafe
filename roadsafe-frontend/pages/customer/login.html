<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadSafe - Login</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>
    <div class="pwa-container" style="justify-content: center;">
        <div style="padding: 24px; text-align: center;">
            <h1 style="color: var(--primary-teal); margin-bottom: 8px;">RoadSafe GPS</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Sign in to request roadside assistance</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="email" class="input-field" id="email" placeholder="Email Address" required>
                <input type="password" class="input-field" id="password" placeholder="Password" required>

                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sign In</button>
            </form>

            <div style="margin-top: 20px; font-size: 0.85rem;">
                <p>Don't have an account? <a href="register.html" style="color: var(--primary-teal);">Register here</a>
                </p>
                <p style="margin-top: 8px;"><a href="../worker/login.html" style="color: var(--text-secondary);">Worker
                        Login</a> | <a href="../admin/login.html" style="color: var(--text-secondary);">Admin Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/offline.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            try {
                await Auth.login({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    role: 'CUSTOMER'
                });
            } catch (err) {
                alert("Invalid login credentials.");
            }
        }
    </script>
</body>

</html>
