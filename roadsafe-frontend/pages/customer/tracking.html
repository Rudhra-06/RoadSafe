<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track assistance</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="home.html">‹</a><span class="header-title">Track assistance</span><span id="status"></span></header><section class="content-body"><div id="message"></div><div class="map-placeholder"><div><p>Live location visualization</p><small id="coordinates"></small></div></div><section class="card"><h3 id="title">Assistance request</h3><p class="muted" id="ticketId"></p><p id="detail"></p></section><section class="card"><h3>Service progress</h3><div class="timeline" id="timeline"></div></section></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ws.js"></script><script src="../../js/ui.js"></script><script>const id=localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID),steps=['REQUESTED','ASSIGNED','ACCEPTED','EN_ROUTE','ARRIVED','IN_SERVICE','COMPLETED'];let ticket;if(!id)location.href='history.html';function render(t){ticket=t;status.innerHTML=UI.statusBadge(t.status);title.textContent=t.description;ticketId.textContent='Ticket #'+t.id;coordinates.textContent=`${t.latitude.toFixed(5)}, ${t.longitude.toFixed(5)}`;const failed=['CANCELLED','FAILED','NO_RESPONDER'].includes(t.status),current=steps.indexOf(t.status);timeline.innerHTML=(failed?[...steps.slice(0,Math.max(1,current)),t.status]:steps).map((s,i)=>`<div class="timeline-item ${failed&&s===t.status?'failed':i<current?'done':i===current?'current':''}">${UI.statusLabel(s)}</div>`).join('');detail.textContent=failed?'Dispatch needs attention. Please contact support or create a new request.':'This page updates as your provider progresses.'}API.get('/tickets/'+id).then(render).catch(()=>UI.alert(message,'This request could not be loaded.'));WSManager.connect('tickets/'+id,e=>{if(e.event==='STATUS_UPDATE'&&ticket)render({...ticket,status:e.new_status})});</script></body></html>
