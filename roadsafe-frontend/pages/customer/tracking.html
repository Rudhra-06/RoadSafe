<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Track Assistance — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<main class="pwa-container no-bottom-nav">
    <header class="header">
        <a href="home.html" class="header-back" aria-label="Home">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Live Dispatch Status</span>
        <span id="statusBadge"></span>
    </header>

    <section class="content-body">
        <div id="message"></div>

        <!-- Live Navigation Map Card -->
        <div class="nav-map-card" style="position:relative;">
            <div class="nav-stats-bar" id="navStatsBar" style="display:none;">
                <div class="nav-stat-item">
                    <span class="nav-stat-label">Estimated Arrival</span>
                    <span class="nav-stat-value highlight" id="routeEta">-- mins</span>
                </div>
                <div class="nav-stat-item">
                    <span class="nav-stat-label">Road Distance</span>
                    <span class="nav-stat-value" id="routeDist">-- km</span>
                </div>
                <div class="nav-stat-item" style="align-items: flex-end;">
                    <span class="live-pulse-indicator">
                        <span class="pulse-dot"></span>
                        <span id="routeStatusText">Live Route</span>
                    </span>
                </div>
            </div>

            <div id="map" style="height: 310px; width: 100%; z-index: 1;"></div>

            <button id="recenterBtn" class="map-recenter-btn" style="display:none; position:absolute; top:58px; right:14px; z-index:1000; background:#ffffff; border:1px solid #cbd5e1; border-radius:20px; padding:7px 14px; font-size:0.78rem; font-weight:700; color:#1d4ed8; box-shadow:0 4px 14px rgba(0,0,0,0.16); cursor:pointer; align-items:center; gap:6px;" onclick="recenterRoute()" title="Fit Route">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#1d4ed8" stroke-width="2.5" style="width:14px;height:14px;min-width:14px;max-width:14px;"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
                <span>Fit Route</span>
            </button>
        </div>

        <section class="card">
            <h3 id="title" style="font-size:1.05rem; font-weight:700;">Loading request…</h3>
            <p class="muted" id="ticketId" style="font-size:0.8rem;"></p>
            <p id="detail" style="margin-top:8px; font-size:0.88rem;"></p>
        </section>

        <section class="card" id="responderCard" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h3 style="font-size:0.95rem; font-weight:700;">Assigned Responder</h3>
                <span id="responderEtaBadge" class="chip" style="background:#e0e7ff; color:#3730a3; font-weight:700;">Live Navigation</span>
            </div>
            <div id="responderDetails"></div>
            <p id="mechanicLocation" class="muted" style="font-size:0.8rem; margin-top:6px;"></p>
        </section>

        <section class="card">
            <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:12px;">Dispatch Progression</h3>
            <div class="timeline" id="timeline"></div>
        </section>

        <div id="actionArea" style="margin-top:16px;"></div>
    </section>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ws.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();

    const id = localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
    const steps = ['REQUESTED', 'ASSIGNED', 'ACCEPTED', 'EN_ROUTE', 'ARRIVED', 'IN_SERVICE', 'COMPLETED'];
    let ticket;
    let responderInfo = null;

    let leafMap = null;
    let custMarker = null;
    let workMarker = null;
    let routeLayerGroup = null;
    let currentRouteBounds = null;

    // Customer breakdown vehicle marker (Car Emoji/Pic + Big Endpoint Black Dot)
    const customerIcon = L.divIcon({
        className: 'custom-marker-customer',
        html: `<div class="customer-vehicle-badge" title="Customer Breakdown Location">
                  <span style="font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center;">🚗</span>
               </div>
               <div class="endpoint-dot"></div>`,
        iconSize: [36, 54],
        iconAnchor: [18, 43]
    });

    // Worker technician marker (Man Mechanic Emoji/Pic + Pulse + Big Endpoint Black Dot)
    const workerIcon = L.divIcon({
        className: 'custom-marker-worker',
        html: `<div class="worker-radar-ring"></div>
               <div class="worker-avatar-badge" title="Assigned Technician">
                  <span style="font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center;">👨‍🔧</span>
               </div>
               <div class="endpoint-dot"></div>`,
        iconSize: [44, 54],
        iconAnchor: [22, 43]
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function recenterRoute() {
        if (leafMap && currentRouteBounds) {
            leafMap.fitBounds(currentRouteBounds, { padding: [50, 50], maxZoom: 16 });
        }
    }

    async function fetchAndDrawRoute(cLat, cLng, wLat, wLng) {
        if (!leafMap) return;

        if (!routeLayerGroup) {
            routeLayerGroup = L.layerGroup().addTo(leafMap);
        } else {
            routeLayerGroup.clearLayers();
        }

        let straightDistKm = calcDistance(cLat, cLng, wLat, wLng);
        // If customer and worker coordinates overlap in local testing, create demo separation
        if (straightDistKm < 0.25) {
            wLat = cLat + 0.025;
            wLng = cLng + 0.022;
            straightDistKm = calcDistance(cLat, cLng, wLat, wLng);
        }

        // Ensure markers sit directly on the route endpoints with high z-index
        if (custMarker) {
            custMarker.setLatLng([cLat, cLng]);
            custMarker.setZIndexOffset(2000);
        }
        if (workMarker) {
            workMarker.setLatLng([wLat, wLng]);
            workMarker.setZIndexOffset(2000);
        }

        let roadDistKm = (straightDistKm * 1.25).toFixed(1);
        let durationMins = Math.max(2, Math.round((roadDistKm / 35) * 60));
        let latlngs = [[wLat, wLng], [cLat, cLng]];

        try {
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${wLng},${wLat};${cLng},${cLat}?overview=full&geometries=geojson`;
            const res = await fetch(osrmUrl);
            if (res.ok) {
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coords = route.geometry.coordinates; // [lng, lat]
                    latlngs = coords.map(c => [c[1], c[0]]);
                    roadDistKm = (route.distance / 1000).toFixed(1);
                    durationMins = Math.max(1, Math.round(route.duration / 60));
                }
            }
        } catch (e) {
            console.log('OSRM routing fallback used:', e);
        }

        let etaFormatted = durationMins < 60 ? `${durationMins} min` : `${Math.floor(durationMins/60)} hr ${durationMins%60} min`;

        const navBar = document.getElementById('navStatsBar');
        const routeEta = document.getElementById('routeEta');
        const routeDist = document.getElementById('routeDist');
        const recenterBtn = document.getElementById('recenterBtn');
        const responderEtaBadge = document.getElementById('responderEtaBadge');

        if (navBar) navBar.style.display = 'flex';
        if (routeEta) routeEta.textContent = etaFormatted;
        if (routeDist) routeDist.textContent = `${roadDistKm} km`;
        if (recenterBtn) recenterBtn.style.display = 'inline-flex';
        if (responderEtaBadge) responderEtaBadge.textContent = `${roadDistKm} km • ~${etaFormatted}`;

        // Casing polyline (dark outer boundary for clear contrast)
        const casingPolyline = L.polyline(latlngs, {
            color: '#1e40af',
            weight: 7,
            opacity: 0.8,
            lineCap: 'round',
            lineJoin: 'round'
        });

        // Vibrant Google Maps style core blue polyline
        const corePolyline = L.polyline(latlngs, {
            color: '#2563eb',
            weight: 5,
            opacity: 0.95,
            lineCap: 'round',
            lineJoin: 'round'
        });
        
        routeLayerGroup.addLayer(casingPolyline);
        routeLayerGroup.addLayer(corePolyline);

        // Place ETA Badge Pill at midpoint of route
        const midIdx = Math.floor(latlngs.length / 2);
        const midPoint = latlngs[midIdx] || [(cLat + wLat) / 2, (cLng + wLng) / 2];

        const etaBadgeIcon = L.divIcon({
            className: 'route-eta-marker',
            html: `<div class="route-eta-pill" style="background:#1a73e8; color:#ffffff; font-size:12px; font-weight:700; padding:3px 8px; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,0.3); border:1.5px solid #ffffff; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; line-height:1;">
                      <svg viewBox="0 0 24 24" style="width:12px;height:12px;min-width:12px;max-width:12px;fill:#fff;display:inline-block;" width="12" height="12"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                      <span>${etaFormatted}</span>
                   </div>`,
            iconSize: [80, 24],
            iconAnchor: [40, 12]
        });

        const etaMarker = L.marker(midPoint, { icon: etaBadgeIcon, interactive: false });
        routeLayerGroup.addLayer(etaMarker);

        currentRouteBounds = L.latLngBounds(latlngs);
        leafMap.fitBounds(currentRouteBounds, { padding: [50, 50], maxZoom: 16 });
    }

    function initOrUpdateMap(cLat, cLng, wLat = null, wLng = null, responderData = null) {
        if (!leafMap) {
            leafMap = L.map('map').setView([cLat, cLng], 14);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(leafMap);
            custMarker = L.marker([cLat, cLng], { icon: customerIcon, zIndexOffset: 2000 }).addTo(leafMap)
                .bindPopup('<b>Customer Breakdown Location</b>');
        } else {
            custMarker.setLatLng([cLat, cLng]);
            custMarker.setZIndexOffset(2000);
        }

        if (wLat !== null && wLng !== null) {
            const name = responderData?.shop_name || responderData?.full_name || 'Assigned Technician';
            const phone = responderData?.phone_number ? `<br>Tel: ${responderData.phone_number}` : '';
            const dist = calcDistance(cLat, cLng, wLat, wLng).toFixed(1);
            const popupContent = `<b>👨‍🔧 ${UI.escape(name)}</b>${phone}<br>Live Dispatch Active<br>Distance: ~${dist} km`;

            if (!workMarker) {
                workMarker = L.marker([wLat, wLng], { icon: workerIcon, zIndexOffset: 2000 }).addTo(leafMap)
                    .bindPopup(popupContent);
            } else {
                workMarker.setLatLng([wLat, wLng]);
                workMarker.setZIndexOffset(2000);
                workMarker.setPopupContent(popupContent);
            }

            // Draw full navigation road route
            fetchAndDrawRoute(cLat, cLng, wLat, wLng);
        } else {
            leafMap.setView([cLat, cLng], 14);
        }
    }

    if (!id) location.href = 'history.html';

    async function loadResponderInfo(responderId) {
        if (!responderId) return;
        try {
            const resp = await API.get('/responders/' + responderId);
            responderInfo = resp;
            const card = document.getElementById('responderCard');
            const details = document.getElementById('responderDetails');
            card.style.display = 'block';
            details.innerHTML = `
                <p style="font-weight:600; font-size:0.95rem;">${UI.escape(resp.shop_name || resp.full_name || 'Assigned Technician')}</p>
                <p class="muted" style="font-size:0.82rem;">${UI.escape((resp.type || '').replaceAll('_', ' '))}${resp.phone_number ? ` · Tel: ${UI.escape(resp.phone_number)}` : ''}</p>
            `;

            let wLat = resp.latitude;
            let wLng = resp.longitude;
            if ((!wLat || !wLng) && ticket) {
                wLat = ticket.latitude + 0.024;
                wLng = ticket.longitude + 0.021;
            }

            if (wLat && wLng && ticket) {
                document.getElementById('mechanicLocation').textContent = `Mechanic Live GPS: ${Number(wLat).toFixed(4)}, ${Number(wLng).toFixed(4)}`;
                initOrUpdateMap(ticket.latitude, ticket.longitude, wLat, wLng, resp);
            }
        } catch (e) {
            console.log('Responder details fetch:', e);
        }
    }

    function render(t) {
        ticket = t;
        document.getElementById('statusBadge').innerHTML = UI.statusBadge(t.status);
        document.getElementById('title').textContent = t.description;
        document.getElementById('ticketId').textContent = 'Ticket #' + t.id.slice(0, 8);

        initOrUpdateMap(t.latitude, t.longitude);

        const failed = ['CANCELLED', 'FAILED', 'NO_RESPONDER'].includes(t.status);
        const current = steps.indexOf(t.status);

        document.getElementById('timeline').innerHTML = (failed ? [...steps.slice(0, Math.max(1, current)), t.status] : steps).map((s, i) => `
            <div class="timeline-item ${failed && s === t.status ? 'failed' : i < current ? 'done' : i === current ? 'current' : ''}">
                <strong>${UI.statusLabel(s)}</strong>
            </div>
        `).join('');

        const statusDescriptions = {
            REQUESTED: 'Request received. Searching for nearby responders…',
            DISPATCHING: 'Dispatching to nearest available mechanics…',
            ASSIGNED: 'Responder assigned. Awaiting confirmation.',
            ACCEPTED: 'Responder accepted your request and is en route.',
            EN_ROUTE: 'Responder is actively navigating to your location.',
            ARRIVED: 'Responder has arrived at your location.',
            IN_SERVICE: 'Service and repairs currently in progress.',
            COMPLETED: 'Service completed successfully.'
        };

        document.getElementById('detail').textContent = failed
            ? 'Dispatch could not be completed automatically. Please check your request.'
            : (statusDescriptions[t.status] || 'Your responder is updating progress in real-time.');

        const activeAssignment = (t.assignments || []).find(a => a.status === 'ACCEPTED' || a.status === 'OFFERED');
        if (activeAssignment && activeAssignment.responder_id) {
            loadResponderInfo(activeAssignment.responder_id);
        }

        const actionArea = document.getElementById('actionArea');
        if (t.status === 'COMPLETED') {
            actionArea.innerHTML = `
                <div class="card" style="background:var(--success-bg,#f0fdf4); border-color:var(--success-green,#059669); margin-bottom:12px; padding:16px; text-align:center;">
                    <p style="font-weight:700; color:var(--success-green,#059669); margin-bottom:10px;">Roadside Assistance Completed</p>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <a href="payment.html?ticket_id=${encodeURIComponent(t.id)}" class="btn btn-primary">
                            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                            View &amp; Settle Invoice
                        </a>
                        <a href="review.html?ticket_id=${encodeURIComponent(t.id)}" class="btn btn-outline" style="font-size:0.85rem;">
                            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                            Leave Feedback &amp; Review
                        </a>
                    </div>
                </div>
            `;
        }
    }

    API.get('/tickets/' + id).then(render).catch(() => UI.alert(document.getElementById('message'), 'This request could not be loaded.'));
    
    if (typeof WSManager !== 'undefined') {
        WSManager.connect('tickets/' + id, e => {
            if (e.event === 'STATUS_UPDATE') {
                API.get('/tickets/' + id).then(render).catch(() => {
                    if (ticket) render({ ...ticket, status: e.new_status });
                });
            } else if (e.event === 'LOCATION_UPDATE') {
                const locEl = document.getElementById('mechanicLocation');
                if (locEl) {
                    locEl.textContent = `Mechanic Live GPS: ${Number(e.latitude).toFixed(4)}, ${Number(e.longitude).toFixed(4)}`;
                }
                if (ticket) {
                    initOrUpdateMap(ticket.latitude, ticket.longitude, Number(e.latitude), Number(e.longitude), responderInfo);
                }
            }
        });
    }
</script>
</body>
</html>
