<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Track Assistance — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<main class="pwa-container no-bottom-nav">
    <header class="header">
        <a href="home.html" class="header-back" aria-label="Home">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Live Dispatch Status</span>
        <span id="statusBadge"></span>
    </header>

    <section class="content-body">
        <div id="message"></div>

        <div id="map" style="height: 280px; border-radius: var(--radius-md, 8px); margin-bottom: 16px; border: 1px solid var(--border-light); z-index: 1;"></div>

        <section class="card">
            <h3 id="title" style="font-size:1.05rem; font-weight:700;">Loading request…</h3>
            <p class="muted" id="ticketId" style="font-size:0.8rem;"></p>
            <p id="detail" style="margin-top:8px; font-size:0.88rem;"></p>
        </section>

        <section class="card" id="responderCard" style="display:none;">
            <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:8px;">Assigned Responder</h3>
            <div id="responderDetails"></div>
            <p id="mechanicLocation" class="muted" style="font-size:0.8rem; margin-top:6px;"></p>
        </section>

        <section class="card">
            <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:12px;">Dispatch Progression</h3>
            <div class="timeline" id="timeline"></div>
        </section>

        <div id="actionArea" style="margin-top:16px;"></div>
    </section>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ws.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();

    const id = localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
    const steps = ['REQUESTED', 'ASSIGNED', 'ACCEPTED', 'EN_ROUTE', 'ARRIVED', 'IN_SERVICE', 'COMPLETED'];
    let ticket;
    let responderInfo = null;

    let leafMap = null;
    let custMarker = null;
    let workMarker = null;

    const customerIcon = L.divIcon({
        className: 'custom-leaflet-marker customer-marker',
        html: `<div style="background:#0f766e; width:28px; height:28px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
               </div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
    });

    const workerIcon = L.divIcon({
        className: 'custom-leaflet-marker worker-marker',
        html: `<div style="background:#4338ca; width:32px; height:32px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.5"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
               </div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function initOrUpdateMap(cLat, cLng, wLat = null, wLng = null, responderData = null) {
        if (!leafMap) {
            leafMap = L.map('map').setView([cLat, cLng], 14);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(leafMap);
            custMarker = L.marker([cLat, cLng], { icon: customerIcon }).addTo(leafMap)
                .bindPopup('<b>Your Location</b>');
        } else {
            custMarker.setLatLng([cLat, cLng]);
        }

        if (wLat !== null && wLng !== null) {
            const name = responderData?.shop_name || responderData?.full_name || 'Assigned Technician';
            const phone = responderData?.phone_number ? `<br>Tel: ${responderData.phone_number}` : '';
            const dist = calcDistance(cLat, cLng, wLat, wLng).toFixed(2);
            const popupContent = `<b>${UI.escape(name)}</b>${phone}<br>Status: Dispatch Active<br>Distance: ${dist} km`;

            if (!workMarker) {
                workMarker = L.marker([wLat, wLng], { icon: workerIcon }).addTo(leafMap)
                    .bindPopup(popupContent);
            } else {
                workMarker.setLatLng([wLat, wLng]);
                workMarker.setPopupContent(popupContent);
            }

            // Adjust view to show both customer and worker
            const bounds = L.latLngBounds([[cLat, cLng], [wLat, wLng]]);
            leafMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
        }
    }

    if (!id) location.href = 'history.html';

    async function loadResponderInfo(responderId) {
        if (!responderId) return;
        try {
            const resp = await API.get('/responders/' + responderId);
            responderInfo = resp;
            const card = document.getElementById('responderCard');
            const details = document.getElementById('responderDetails');
            card.style.display = 'block';
            details.innerHTML = `
                <p style="font-weight:600; font-size:0.95rem;">${UI.escape(resp.shop_name || resp.full_name || 'Assigned Technician')}</p>
                <p class="muted" style="font-size:0.82rem;">${UI.escape((resp.type || '').replaceAll('_', ' '))}${resp.phone_number ? ` · Tel: ${UI.escape(resp.phone_number)}` : ''}</p>
            `;
            if (resp.latitude && resp.longitude && ticket) {
                document.getElementById('mechanicLocation').textContent = `Mechanic Live GPS: ${resp.latitude.toFixed(4)}, ${resp.longitude.toFixed(4)}`;
                initOrUpdateMap(ticket.latitude, ticket.longitude, resp.latitude, resp.longitude, resp);
            }
        } catch (e) {
            console.log('Responder details fetch:', e);
        }
    }

    function render(t) {
        ticket = t;
        document.getElementById('statusBadge').innerHTML = UI.statusBadge(t.status);
        document.getElementById('title').textContent = t.description;
        document.getElementById('ticketId').textContent = 'Ticket #' + t.id.slice(0, 8);

        initOrUpdateMap(t.latitude, t.longitude);

        const failed = ['CANCELLED', 'FAILED', 'NO_RESPONDER'].includes(t.status);
        const current = steps.indexOf(t.status);

        document.getElementById('timeline').innerHTML = (failed ? [...steps.slice(0, Math.max(1, current)), t.status] : steps).map((s, i) => `
            <div class="timeline-item ${failed && s === t.status ? 'failed' : i < current ? 'done' : i === current ? 'current' : ''}">
                <strong>${UI.statusLabel(s)}</strong>
            </div>
        `).join('');

        const statusDescriptions = {
            REQUESTED: 'Request received. Searching for nearby responders…',
            DISPATCHING: 'Dispatching to nearest available mechanics…',
            ASSIGNED: 'Responder assigned. Awaiting confirmation.',
            ACCEPTED: 'Responder accepted your request and is preparing.',
            EN_ROUTE: 'Responder is on the way to your location.',
            ARRIVED: 'Responder has arrived at your location.',
            IN_SERVICE: 'Service and repairs currently in progress.',
            COMPLETED: 'Service completed successfully.'
        };

        document.getElementById('detail').textContent = failed
            ? 'Dispatch could not be completed automatically. Please check your request.'
            : (statusDescriptions[t.status] || 'Your responder is updating progress in real-time.');

        const activeAssignment = (t.assignments || []).find(a => a.status === 'ACCEPTED' || a.status === 'OFFERED');
        if (activeAssignment && activeAssignment.responder_id) {
            loadResponderInfo(activeAssignment.responder_id);
        }

        const actionArea = document.getElementById('actionArea');
        if (t.status === 'COMPLETED') {
            actionArea.innerHTML = `
                <div class="card" style="background:var(--success-bg,#f0fdf4); border-color:var(--success-green,#059669); margin-bottom:12px; padding:16px; text-align:center;">
                    <p style="font-weight:700; color:var(--success-green,#059669); margin-bottom:10px;">Roadside Assistance Completed</p>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <a href="payment.html?ticket_id=${encodeURIComponent(t.id)}" class="btn btn-primary">
                            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                            View &amp; Settle Invoice
                        </a>
                        <a href="review.html?ticket_id=${encodeURIComponent(t.id)}" class="btn btn-outline" style="font-size:0.85rem;">
                            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                            Leave Feedback &amp; Review
                        </a>
                    </div>
                </div>
            `;
        }
    }

    API.get('/tickets/' + id).then(render).catch(() => UI.alert(document.getElementById('message'), 'This request could not be loaded.'));
    
    if (typeof WSManager !== 'undefined') {
        WSManager.connect('tickets/' + id, e => {
            if (e.event === 'STATUS_UPDATE') {
                API.get('/tickets/' + id).then(render).catch(() => {
                    if (ticket) render({ ...ticket, status: e.new_status });
                });
            } else if (e.event === 'LOCATION_UPDATE') {
                const locEl = document.getElementById('mechanicLocation');
                if (locEl) {
                    locEl.textContent = `Mechanic Live GPS: ${Number(e.latitude).toFixed(4)}, ${Number(e.longitude).toFixed(4)}`;
                }
                if (ticket) {
                    initOrUpdateMap(ticket.latitude, ticket.longitude, Number(e.latitude), Number(e.longitude), responderInfo);
                }
            }
        });
    }
</script>
</body>
</html>
