<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Invoice Payment — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<main class="pwa-container no-bottom-nav">
    <header class="header">
        <a href="history.html" class="header-back" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Invoice &amp; Settlement</span>
        <span style="width:48px;"></span>
    </header>

    <section class="content-body">
        <div id="message"></div>
        <div id="invoice"></div>

        <button class="btn btn-primary" id="pay" disabled style="margin-top:16px;">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Pay Securely Online (Razorpay)
        </button>
    </section>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();

    const invoiceId = new URLSearchParams(window.location.search).get('invoice_id');
    const host = document.querySelector('#invoice');
    const button = document.querySelector('#pay');
    const msgEl = document.getElementById('message');
    let invoice;

    if (!invoiceId) window.location.href = 'history.html';

    async function load() {
        UI.loading(host, 'Loading invoice summary…');
        try {
            invoice = await API.get('/billing/invoices/' + invoiceId);
            host.innerHTML = `
                <section class="card" style="text-align:center; padding:24px 16px;">
                    <p class="muted" style="font-size:0.85rem;">Invoice #${UI.escape(invoice.invoice_number)}</p>
                    <h1 style="font-size:1.8rem; font-weight:800; color:var(--primary-teal); margin:8px 0;">
                        ${Number(invoice.grand_total).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}
                    </h1>
                    <div>${UI.statusBadge(invoice.status)}</div>
                </section>

                <section class="card">
                    <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:12px;">Bill Items Breakdown</h3>
                    ${(invoice.lines || []).map(x => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-light); font-size:0.88rem;">
                            <span>${UI.escape(x.description)} <span class="muted">&times; ${x.quantity}</span></span>
                            <strong>${Number(x.line_total).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</strong>
                        </div>
                    `).join('')}
                    <div style="display:flex; justify-content:space-between; padding-top:12px; font-size:0.85rem; color:var(--text-secondary);">
                        <span>Applicable Taxes</span>
                        <span>${Number(invoice.tax_total || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                </section>
            `;

            button.disabled = invoice.status === 'PAID';
            button.innerHTML = invoice.status === 'PAID'
                ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Invoice Paid in Full'
                : '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';

            if (invoice.status === 'PAID') {
                button.classList.remove('btn-primary');
                button.classList.add('btn-success');
            }
        } catch (e) {
            UI.alert(msgEl, 'Invoice could not be loaded.');
        }
    }

    button.onclick = async () => {
        button.disabled = true;
        button.textContent = 'Initializing secure checkout…';
        try {
            const orderData = await API.post(`/billing/invoices/${invoiceId}/payment-order`, {});
            
            if (typeof Razorpay === 'undefined') {
                UI.alert(msgEl, 'Razorpay SDK could not be loaded. Please check your internet connection.');
                button.disabled = false;
                button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
                return;
            }

            const options = {
                key: orderData.key_id,
                amount: orderData.amount,
                currency: orderData.currency,
                name: "RoadSafe GPS",
                description: "Roadside Assistance Settlement — " + (invoice.invoice_number || ''),
                order_id: orderData.order_id,
                handler: async function (response) {
                    try {
                        button.disabled = true;
                        button.textContent = 'Verifying payment with backend…';
                        await API.post(`/billing/invoices/${invoiceId}/verify-payment`, {
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        });
                        await load();
                        UI.alert(msgEl, 'Payment verified successfully! Redirecting to review…', 'success');
                        setTimeout(() => {
                            if (invoice && invoice.ticket_id) {
                                location.href = 'review.html?ticket_id=' + invoice.ticket_id;
                            }
                        }, 1200);
                    } catch (err) {
                        UI.alert(msgEl, err.message || 'Payment signature verification failed.');
                        await load();
                    }
                },
                modal: {
                    ondismiss: function() {
                        button.disabled = false;
                        button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
                    }
                },
                prefill: {
                    name: Auth.getUser()?.full_name || 'Driver',
                    email: Auth.getUser()?.email || 'driver@roadsafe.com',
                    contact: Auth.getUser()?.phone_number || ''
                },
                theme: {
                    color: "#008080"
                }
            };

            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function (resp) {
                button.disabled = false;
                button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
                UI.alert(msgEl, 'Payment Failed: ' + (resp.error?.description || 'Transaction declined or cancelled.'));
            });
            rzp.open();
        } catch (e) {
            button.disabled = false;
            button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
            UI.alert(msgEl, e.message || 'Could not initiate payment order.');
        }
    };

    load();
</script>
</body>
</html>
