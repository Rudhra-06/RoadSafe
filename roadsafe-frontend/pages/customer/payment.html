<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay invoice</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><span class="header-title">Invoice payment</span></header><section class="content-body"><div id="message"></div><div id="invoice"></div><button class="btn btn-primary" id="pay" disabled>Pay securely with Razorpay</button></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>const invoiceId=new URLSearchParams(window.location.search).get('invoice_id'),host=document.querySelector('#invoice'),button=document.querySelector('#pay');let invoice;if(!invoiceId)window.location.href='history.html';async function load(){UI.loading(host,'Loading invoice…');try{invoice=await API.get('/billing/invoices/'+invoiceId);host.innerHTML=`<section class="card"><p class="muted">Invoice ${UI.escape(invoice.invoice_number)}</p><h1>${Number(invoice.grand_total).toLocaleString(undefined,{style:'currency',currency:'INR'})}</h1><p>${UI.statusBadge(invoice.status)}</p></section><section class="card"><h3>Breakdown</h3>${invoice.lines.map(x=>`<div style="display:flex;justify-content:space-between;margin-top:8px"><span>${UI.escape(x.description)} × ${x.quantity}</span><span>${Number(x.line_total).toLocaleString(undefined,{style:'currency',currency:'INR'})}</span></div>`).join('')}<div class="meta-row"><span>Tax ${Number(invoice.tax_total).toLocaleString(undefined,{style:'currency',currency:'INR'})}</span></div></section>`;button.disabled=invoice.status==='PAID';button.textContent=invoice.status==='PAID'?'Invoice paid':'Pay securely with Razorpay'}catch(e){UI.alert(message,'Invoice could not be loaded.')}}async function checkout(){button.disabled=true;try{const order=await API.post(`/billing/invoices/${invoiceId}/payment-order`,{});await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)});new Razorpay({key:order.key_id,amount:order.amount,currency:order.currency,name:'RoadSafe GPS',description:invoice.invoice_number,order_id:order.order_id,handler:async r=>{try{await API.post(`/billing/invoices/${invoiceId}/verify-payment`,r);window.location.href='review.html?ticket_id='+invoice.ticket_id}catch(e){UI.alert(message,'Payment could not be verified. Please contact support.')}},modal:{ondismiss:()=>{button.disabled=false;UI.alert(message,'Checkout was closed. No payment was recorded.')}}}).open()}catch(e){button.disabled=false;UI.alert(message,e.message||'Checkout could not be opened.')}}button.onclick=checkout;load();</script></body></html>
