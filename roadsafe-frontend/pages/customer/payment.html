<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Invoice Payment — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<main class="pwa-container no-bottom-nav">
    <header class="header">
        <a href="history.html" class="header-back" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Invoice &amp; Settlement</span>
        <span style="width:48px;"></span>
    </header>

    <section class="content-body">
        <div id="message"></div>
        <div id="invoice"></div>

        <button class="btn btn-primary" id="pay" disabled style="margin-top:16px;">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Pay Securely Online (Razorpay)
        </button>
    </section>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();

    const params = new URLSearchParams(window.location.search);
    const invoiceId = params.get('invoice_id') || params.get('ticket_id') || localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
    const host = document.querySelector('#invoice');
    const button = document.querySelector('#pay');
    const msgEl = document.getElementById('message');
    let invoice;

    if (!invoiceId) window.location.href = 'history.html';

    async function load() {
        UI.loading(host, 'Loading invoice summary…');
        try {
            invoice = await API.get('/billing/invoices/' + invoiceId);
            
            const serviceLines = (invoice.lines || []).filter(l => l.line_type === 'SERVICE');
            const partLines = (invoice.lines || []).filter(l => l.line_type === 'PART');
            const subtotal = Number(invoice.service_total || 0) + Number(invoice.parts_total || 0);

            host.innerHTML = `
                <section class="card" style="text-align:center; padding:20px 16px;">
                    <p class="muted" style="font-size:0.82rem; margin-bottom:2px;">Invoice #${UI.escape(invoice.invoice_number)}</p>
                    <p class="muted" style="font-size:0.78rem; margin-bottom:6px;">Ticket ID: <code>#${UI.escape(invoice.ticket_id ? invoice.ticket_id.slice(0, 8) : '')}</code></p>
                    <h1 style="font-size:1.9rem; font-weight:800; color:var(--primary-teal); margin:6px 0;">
                        ${Number(invoice.grand_total).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}
                    </h1>
                    <div style="margin-top:6px; display:inline-flex; align-items:center; gap:6px;">
                        <span>Invoice Status:</span> ${UI.statusBadge(invoice.status)}
                    </div>
                </section>

                <section class="card">
                    <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:10px;">Service Delivered</h3>
                    ${serviceLines.length ? serviceLines.map(s => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:0.88rem;">
                            <span>${UI.escape(s.description)}</span>
                            <strong>${Number(s.line_total).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</strong>
                        </div>
                    `).join('') : `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:0.88rem;">
                            <span>Roadside Assistance</span>
                            <strong>${Number(invoice.service_total || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</strong>
                        </div>
                    `}
                </section>

                ${partLines.length ? `
                <section class="card">
                    <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:10px;">Parts &amp; Materials Used</h3>
                    ${partLines.map(p => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border-light); font-size:0.88rem;">
                            <div>
                                <span>${UI.escape(p.description)}</span>
                                <small class="muted" style="display:block; font-size:0.75rem;">Qty: ${p.quantity} &times; ${Number(p.unit_price).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</small>
                            </div>
                            <strong>${Number(p.line_total).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</strong>
                        </div>
                    `).join('')}
                </section>
                ` : ''}

                <section class="card">
                    <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:12px;">Payment Breakdown</h3>
                    <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:0.86rem; color:var(--text-secondary);">
                        <span>Service Charge</span>
                        <span>${Number(invoice.service_total || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                    ${partLines.length ? `
                    <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:0.86rem; color:var(--text-secondary);">
                        <span>Parts Total</span>
                        <span>${Number(invoice.parts_total || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                    ` : ''}
                    <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:0.86rem; font-weight:600; border-top:1px solid var(--border-light); margin-top:6px; padding-top:6px;">
                        <span>Subtotal</span>
                        <span>${Number(subtotal).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; padding:4px 0; font-size:0.86rem; color:var(--text-secondary);">
                        <span>Taxes &amp; Fees</span>
                        <span>${Number(invoice.tax_total || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; padding:8px 0 4px; font-size:1rem; font-weight:700; border-top:1.5px solid var(--border-light); margin-top:6px; color:var(--primary-teal);">
                        <span>Grand Total</span>
                        <span>${Number(invoice.grand_total).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; padding-top:6px; font-size:0.82rem; color:var(--text-secondary);">
                        <span>Payment Status</span>
                        <strong style="color:${invoice.status === 'PAID' ? 'var(--success-green)' : 'var(--danger-red)'}; font-weight:700;">
                            ${invoice.status === 'PAID' ? 'PAID / SETTLED' : 'PENDING PAYMENT'}
                        </strong>
                    </div>
                </section>
            `;

            button.disabled = invoice.status === 'PAID';
            button.innerHTML = invoice.status === 'PAID'
                ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Invoice Paid in Full'
                : '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';

            if (invoice.status === 'PAID') {
                button.classList.remove('btn-primary');
                button.classList.add('btn-success');
            }
        } catch (e) {
            console.error('Invoice load error:', e);
            host.innerHTML = '<div class="empty-state">Unable to retrieve invoice for this request.</div>';
            UI.alert(msgEl, e.message || 'Invoice could not be loaded.');
        }
    }

    button.onclick = async () => {
        if (!invoice || !invoice.id) return;
        button.disabled = true;
        button.textContent = 'Initializing secure checkout…';
        try {
            const targetId = invoice.id;
            const orderData = await API.post(`/billing/invoices/${targetId}/payment-order`, {});
            
            // Check if operating in dev fallback mode without live Razorpay credentials
            if (orderData.order_id.startsWith('order_dev_') || orderData.key_id === 'rzp_test_key' || typeof Razorpay === 'undefined') {
                button.textContent = 'Confirming payment…';
                await API.post(`/billing/invoices/${targetId}/verify-payment`, {
                    razorpay_order_id: orderData.order_id,
                    razorpay_payment_id: 'pay_dev_' + Math.random().toString(36).substring(2, 12),
                    razorpay_signature: 'sig_dev'
                });
                await load();
                UI.alert(msgEl, 'Payment verified successfully! Redirecting to review…', 'success');
                setTimeout(() => {
                    if (invoice && invoice.ticket_id) {
                        location.href = 'review.html?ticket_id=' + invoice.ticket_id;
                    }
                }, 1200);
                return;
            }

            const options = {
                key: orderData.key_id,
                amount: orderData.amount,
                currency: orderData.currency,
                name: "RoadSafe GPS",
                description: "Roadside Assistance Settlement — " + (invoice.invoice_number || ''),
                order_id: orderData.order_id,
                handler: async function (response) {
                    try {
                        button.disabled = true;
                        button.textContent = 'Verifying payment with backend…';
                        await API.post(`/billing/invoices/${targetId}/verify-payment`, {
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        });
                        await load();
                        UI.alert(msgEl, 'Payment verified successfully! Redirecting to review…', 'success');
                        setTimeout(() => {
                            if (invoice && invoice.ticket_id) {
                                location.href = 'review.html?ticket_id=' + invoice.ticket_id;
                            }
                        }, 1200);
                    } catch (err) {
                        UI.alert(msgEl, err.message || 'Payment signature verification failed.');
                        await load();
                    }
                },
                modal: {
                    ondismiss: function() {
                        button.disabled = false;
                        button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
                    }
                },
                prefill: {
                    name: Auth.getUser()?.full_name || 'Driver',
                    email: Auth.getUser()?.email || 'driver@roadsafe.com',
                    contact: Auth.getUser()?.phone_number || ''
                },
                theme: {
                    color: "#714b67"
                }
            };

            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function (resp) {
                button.disabled = false;
                button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
                UI.alert(msgEl, 'Payment Failed: ' + (resp.error?.description || 'Transaction declined or cancelled.'));
            });
            rzp.open();
        } catch (e) {
            button.disabled = false;
            button.innerHTML = '<svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Securely Online (Razorpay)';
            UI.alert(msgEl, e.message || 'Could not initiate payment order.');
        }
    };

    load();
</script>
</body>
</html>
