<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadSafe | Services</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="home.html" aria-label="Back">‹</a><span class="header-title">Services</span><a href="history.html" aria-label="Requests">${''}</a></header><section class="content-body"><div class="page-heading"><h1>Roadside services</h1><p>Choose a service to see its scope and request help.</p></div><div id="message"></div><div class="service-grid" id="services"></div></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>
const host=document.querySelector('#services');
function iconFor(s){return /tow/i.test(s.category||s.name)?'car':/battery|electric/i.test(s.name)?'clock':'wrench'}
async function load(){UI.loading(host,'Loading available services…');try{const services=await API.get('/services');if(!services.length){host.innerHTML='<div class="empty-state">No services are currently available.</div>';return}host.innerHTML=services.map(s=>`<article class="card service-card"><div class="card-body"><div class="service-top"><span class="service-icon">${UI.icon(iconFor(s))}</span><div><h3>${UI.escape(s.name)}</h3><p class="muted">${UI.escape(s.description||'Professional roadside assistance.')}</p></div></div><div class="meta-row"><span>${UI.icon('clock')}${s.estimated_duration_minutes?`${s.estimated_duration_minutes} min`:'Duration on assessment'}</span><span>From ${Number(s.base_price).toLocaleString(undefined,{style:'currency',currency:'USD'})}</span></div><span class="badge badge-success">Available</span><p><a class="btn btn-primary" href="service-detail.html?id=${encodeURIComponent(s.id)}">View service</a></p></div></article>`).join('')}catch(e){UI.alert(document.querySelector('#message'),'We could not load services. Please try again.');host.innerHTML=''} }load();
</script></body></html>
