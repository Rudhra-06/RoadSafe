<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadSafe | Nearby providers</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="home.html" aria-label="Back">‹</a><span class="header-title">Nearby providers</span></header><section class="content-body"><div class="page-heading"><h1>Providers near you</h1><p>Only currently available providers are listed.</p></div><div id="message"></div><div class="provider-grid" id="providers"></div></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>
const host=document.querySelector('#providers');async function load(lat,lng){UI.loading(host,'Finding providers near your location…');try{const list=await API.get(`/responders/nearby?latitude=${lat}&longitude=${lng}`);if(!list.length){host.innerHTML='<div class="empty-state">No available providers were found nearby. You can still request assistance and dispatch will continue to search.</div>';return}host.innerHTML=list.map(p=>`<article class="card service-card"><div class="provider-image">${UI.icon('wrench')}</div><div class="card-body"><h3>${UI.escape(p.shop_name||p.full_name)}</h3><p class="muted">${UI.escape(p.shop_address||'Location shared after assignment')}</p><div class="meta-row"><span>${UI.icon('map')}${p.distance_km.toFixed(1)} km away</span><span>${UI.icon('check')}Available</span></div><div class="chip-row">${p.skills.map(x=>`<span class="chip">${UI.escape(x)}</span>`).join('')}</div><a class="btn btn-outline" href="provider-detail.html?id=${encodeURIComponent(p.responder_id)}">View details</a></div></article>`).join('')}catch(e){UI.alert(document.querySelector('#message'),'Unable to find providers right now. Check your connection and retry.');host.innerHTML=''}}navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude),()=>load(0,0));
</script></body></html>
