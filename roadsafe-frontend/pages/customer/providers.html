<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RoadSafe | Nearby Providers</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<main class="pwa-container">
    <header class="header">
        <a href="home.html" class="header-back" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Nearby Responders</span>
        <a href="services.html" class="header-icon" aria-label="Services">
            <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
        </a>
    </header>

    <section class="content-body">
        <div class="page-heading">
            <h1>Nearby Assistance</h1>
            <p>Verified mechanics and dispatch providers in your vicinity.</p>
        </div>

        <div id="message"></div>
        <div class="provider-grid" id="providers"></div>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
        <a href="home.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 0 0 1 1h3m10-11l2 2m-2-2v10a1 1 0 0 1-1 1h-3m-6 0a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1m-6 0h6"/></svg>
            Home
        </a>
        <a href="request.html" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Assist
        </a>
        <a href="history.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            History
        </a>
        <a href="notifications.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg>
            Alerts
        </a>
        <a href="#" class="nav-item" onclick="Auth.logout(); return false;" style="color:var(--danger-red);">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3m8-9h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Logout
        </a>
    </nav>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();
    const host = document.querySelector('#providers');

    async function load(lat, lng) {
        UI.loading(host, 'Searching for active responders near you…');
        try {
            const list = await API.get(`/responders/nearby?latitude=${lat}&longitude=${lng}`);
            if (!list.length) {
                host.innerHTML = '<div class="empty-state">No available providers were found nearby currently.<br><a href="request.html" class="btn btn-primary" style="margin-top:12px;">Request Emergency Dispatch</a></div>';
                return;
            }
            host.innerHTML = list.map(p => `
                <article class="card service-card">
                    <div class="provider-image">
                        <svg class="icon" viewBox="0 0 24 24" style="width:40px; height:40px;"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
                    </div>
                    <div class="card-body">
                        <h3 style="font-size:1rem; font-weight:700;">${UI.escape(p.shop_name || p.full_name)}</h3>
                        <p class="muted" style="font-size:0.85rem;">${UI.escape(p.shop_address || 'Verified Mobile Unit')}</p>
                        <div class="meta-row">
                            <span>${UI.icon('map')}${p.distance_km.toFixed(1)} km away</span>
                            <span class="badge badge-success">Ready for Dispatch</span>
                        </div>
                        <div class="chip-row">
                            ${(p.skills || []).map(x => `<span class="chip">${UI.escape(x)}</span>`).join('')}
                        </div>
                        <div style="margin-top:12px;">
                            <a class="btn btn-outline" href="provider-detail.html?id=${encodeURIComponent(p.responder_id)}">View Profile &amp; Contact</a>
                        </div>
                    </div>
                </article>
            `).join('');
        } catch (e) {
            UI.alert(document.querySelector('#message'), 'Unable to locate providers right now.');
            host.innerHTML = '';
        }
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            p => load(p.coords.latitude, p.coords.longitude),
            () => load(11.0168, 76.9558)
        );
    } else {
        load(11.0168, 76.9558);
    }
</script>
</body>
</html>
