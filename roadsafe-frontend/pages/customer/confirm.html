<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm request</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="request.html">‹</a><span class="header-title">Confirm request</span></header><section class="content-body"><div class="page-heading"><h1>Review your request</h1><p>Submit when the service and location are correct.</p></div><div id="message"></div><div id="summary"></div><button class="btn btn-primary" id="submit">Submit assistance request</button></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>const d=JSON.parse(sessionStorage.getItem('rs_request_draft')||'null'),out=document.querySelector('#summary'),btn=document.querySelector('#submit');if(!d)location.href='request.html';else out.innerHTML=`<section class="card"><h3>${UI.escape(d.service.name)}</h3><p class="muted">${UI.escape(d.service.description||'Roadside assistance')}</p><div class="meta-row"><span>${UI.icon('car')}${UI.escape(d.vehicle_type)}</span><span>${UI.icon('map')}${d.latitude.toFixed(5)}, ${d.longitude.toFixed(5)}</span><span>From ${Number(d.service.base_price).toLocaleString(undefined,{style:'currency',currency:'USD'})}</span></div><p>${UI.escape(d.description)}</p></section>`;btn.onclick=async()=>{btn.disabled=true;btn.textContent='Creating request…';try{const r=await API.post('/tickets',d);if(!r.ticket?.id)throw Error('No ticket was returned');localStorage.setItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID,r.ticket.id);sessionStorage.removeItem('rs_request_draft');location.href='tracking.html'}catch(e){btn.disabled=false;btn.textContent='Submit assistance request';UI.alert(message,e.message||'Your request could not be created.')}};</script></body></html>
