<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Dispatch</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>
    <div class="pwa-container">
        <div class="header">
            <span class="header-title">Confirm Dispatch</span>
        </div>

        <div class="content-body" style="text-align: center; padding-top: 30px;">
            <div class="spinner" style="margin: 0 auto 20px auto; width: 40px; height: 40px;"></div>
            <h3>Finding Nearest Available Mechanic...</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px;">Connecting to optimal service
                provider based on your GPS location.</p>

            <div class="card" style="text-align: left; margin-top: 30px;">
                <p><strong>Selected Issue:</strong> Flat Tire Replacement</p>
                <p><strong>Estimated Response Time:</strong> ~10 minutes</p>
                <p><strong>Base Service Fee:</strong> $45.00</p>
            </div>

            <button class="btn btn-outline" style="margin-top: 20px;" onclick="window.location.href='home.html'">Cancel
                Request</button>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        const activeTicketId = localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
        if (!activeTicketId) window.location.href = "request.html";
        setTimeout(() => window.location.href = "tracking.html", 3000);
    </script>
</body>

</html>
