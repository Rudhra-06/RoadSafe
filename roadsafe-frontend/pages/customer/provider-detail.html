<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadSafe | Provider details</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="providers.html" aria-label="Back">‹</a><span class="header-title">Provider details</span></header><section class="content-body" id="content"></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>const id=new URLSearchParams(location.search).get('id'),host=document.querySelector('#content');async function load(){UI.loading(host);try{const p=await API.get('/responders/'+id);host.innerHTML=`<div class="provider-image">${UI.icon('wrench')}</div><div class="page-heading"><h1>${UI.escape(p.shop_name||p.full_name)}</h1><p>${UI.escape(p.shop_address||'Provider address not supplied')}</p></div><section class="card"><p>${UI.statusBadge(p.is_available?'AVAILABLE':'UNAVAILABLE')}</p><div class="meta-row"><span>${UI.icon('map')}Provider location available</span><span>${UI.icon('user')}${UI.escape(p.type.replaceAll('_',' '))}</span></div><div class="chip-row">${p.skills.map(x=>`<span class="chip">${UI.escape(x)}</span>`).join('')}</div></section><section class="map-placeholder"><div>${UI.icon('map')}<p>Map is ready for your Leaflet configuration.</p><small>${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}</small></div></section>${p.phone_number?`<a class="btn btn-outline" href="tel:${encodeURIComponent(p.phone_number)}">${UI.icon('phone')} Contact provider</a>`:''}`}catch(e){host.innerHTML='<div class="empty-state">Provider details are unavailable.</div>'}}load();</script></body></html>
