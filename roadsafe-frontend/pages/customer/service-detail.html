<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RoadSafe | Service Details</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<main class="pwa-container no-bottom-nav">
    <header class="header">
        <a href="services.html" class="header-back" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Service Details</span>
        <span style="width:48px;"></span>
    </header>

    <section class="content-body" id="content"></section>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();
    const id = new URLSearchParams(location.search).get('id');
    const host = document.querySelector('#content');

    function list(label, items) {
        return items?.length ? `
            <section class="card">
                <h3 style="font-size:0.95rem; font-weight:600; margin-bottom:8px;">${label}</h3>
                <div class="chip-row">${items.map(x => `<span class="chip">${UI.escape(x)}</span>`).join('')}</div>
            </section>` : '';
    }

    async function load() {
        if (!id) { location.href = 'services.html'; return; }
        UI.loading(host);
        try {
            const s = await API.get('/services/' + id);
            host.innerHTML = `
                <div class="page-heading">
                    <h1>${UI.escape(s.name)}</h1>
                    <p>${UI.escape(s.description || 'Professional roadside assistance delivered where you are.')}</p>
                </div>
                <section class="card">
                    <div class="meta-row">
                        <span>${UI.icon('clock')}${s.estimated_duration_minutes ? `${s.estimated_duration_minutes} mins estimated` : 'Time confirmed on site'}</span>
                        <span style="font-weight:600; color:var(--primary-teal);">${Number(s.base_price).toLocaleString('en-IN', { style: 'currency', currency: 'INR' })}</span>
                    </div>
                    <p>${UI.statusBadge(s.is_active ? 'AVAILABLE' : 'UNAVAILABLE')}</p>
                </section>
                ${list("What’s Included", s.included_items)}
                ${list('Service Features', s.features)}
                ${list('Compatible Replacement Parts', s.possible_parts)}
                <div style="margin-top:20px;">
                    <a class="btn btn-primary" href="request.html?service_id=${encodeURIComponent(s.id)}">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
                        Request This Service
                    </a>
                </div>
            `;
        } catch (e) {
            host.innerHTML = '<div class="empty-state">This service is unavailable. <br><a href="services.html" class="btn btn-outline" style="margin-top:12px;">Return to Services</a></div>';
        }
    }
    load();
</script>
</body>
</html>
