<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoadSafe | Service details</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="services.html" aria-label="Back">‹</a><span class="header-title">Service details</span></header><section class="content-body" id="content"></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>
const id=new URLSearchParams(location.search).get('id'),host=document.querySelector('#content');function list(label,items){return items?.length?`<section class="card"><h3>${label}</h3><div class="chip-row">${items.map(x=>`<span class="chip">${UI.escape(x)}</span>`).join('')}</div></section>`:''}async function load(){if(!id){location.href='services.html';return}UI.loading(host);try{const s=await API.get('/services/'+id);host.innerHTML=`<div class="page-heading"><h1>${UI.escape(s.name)}</h1><p>${UI.escape(s.description||'Professional roadside assistance delivered where you are.')}</p></div><section class="card"><div class="meta-row"><span>${UI.icon('clock')}${s.estimated_duration_minutes?`${s.estimated_duration_minutes} minutes estimated`:'Time confirmed after assessment'}</span><span>Starting at ${Number(s.base_price).toLocaleString(undefined,{style:'currency',currency:'USD'})}</span></div><p>${UI.statusBadge(s.is_active?'AVAILABLE':'UNAVAILABLE')}</p></section>${list("What’s included",s.included_items)}${list('Service features',s.features)}${list('Possible parts',s.possible_parts)}<a class="btn btn-primary" href="request.html?service_id=${encodeURIComponent(s.id)}">${UI.icon('wrench')} Request service</a>`}catch(e){host.innerHTML='<div class="empty-state">This service is unavailable. <a href="services.html">Return to services</a></div>'}}load();
</script></body></html>
