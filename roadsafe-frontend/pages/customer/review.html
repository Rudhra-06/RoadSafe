<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rate service</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><span class="header-title">Rate your service</span></header><section class="content-body"><div class="page-heading"><h1>How was your assistance?</h1><p>Your review helps us improve provider quality.</p></div><div id="message"></div><form id="reviewForm"><label>Rating</label><select id="rating" class="input-field"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Fair</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select><label>Comment</label><textarea id="comment" class="input-field" maxlength="2000"></textarea><button class="btn btn-primary">Submit review</button></form></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>const ticketId=new URLSearchParams(window.location.search).get('ticket_id'),form=document.querySelector('#reviewForm');if(!ticketId)window.location.href='history.html';form.onsubmit=async e=>{e.preventDefault();try{await API.post('/reviews',{ticket_id:ticketId,rating:Number(rating.value),comment:comment.value||null});UI.alert(message,'Thank you. Your review has been recorded.','success');form.reset()}catch(err){UI.alert(message,err.message||'Review could not be saved.')}};</script></body></html>
