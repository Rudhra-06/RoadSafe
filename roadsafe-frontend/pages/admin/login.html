<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RoadSafe ERP - Admin Login</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body style="background: var(--primary-dark);">
    <div
        style="width: 100%; max-width: 400px; background: white; padding: 32px; border-radius: var(--radius-lg); box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
        <h2 style="color: var(--primary-dark); margin-bottom: 8px;">Admin ERP Hub</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem;">Executive System Access</p>

        <form onsubmit="handleAdminLogin(event)">
            <input type="email" class="input-field" id="adminEmail" placeholder="Admin Credential Identity" required>
            <input type="password" class="input-field" id="adminPass" placeholder="Master Access Code" required>

            <button type="submit" class="btn btn-primary" style="margin-top: 12px; width: 100%;">Authenticate
                Session</button>
        </form>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            try {
                await Auth.login({
                    email: document.getElementById('adminEmail').value,
                    password: document.getElementById('adminPass').value,
                    role: 'ADMIN'
                });
            } catch (err) {
                alert(err.message || 'Unable to sign in.');
            }
        }
    </script>
</body>

</html>
