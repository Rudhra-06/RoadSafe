<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadSafe ERP - Admin Login</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body style="background: var(--primary-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 100%; max-width: 440px; background: var(--surface-white); padding: 36px 32px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
            <div style="width:44px; height:44px; background:var(--primary-teal); border-radius:var(--radius-md); display:grid; place-items:center; color:white;">
                <svg viewBox="0 0 24 24" style="width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2;"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div>
                <h2 style="color: var(--primary-dark); font-size:1.4rem; font-weight:700;">RoadSafe ERP</h2>
                <p style="color: var(--text-secondary); font-size: 0.85rem;">Executive Management Console</p>
            </div>
        </div>

        <div id="errorBox" class="alert alert-error" style="display:none;"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" style="margin-top:20px;">
            <div class="form-group">
                <label class="form-label" for="adminEmail">Executive Identity (Email)</label>
                <input type="email" class="input-field" id="adminEmail" placeholder="admin@roadsafe.local" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="adminPass">Master Access Code</label>
                <input type="password" class="input-field" id="adminPass" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 16px; width: 100%;">
                <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                Authenticate Session
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.85rem; color: var(--text-secondary); border-top: 1px solid var(--border-light); padding-top: 16px;">
            <a href="../customer/login.html">Customer Portal</a> &nbsp;•&nbsp; <a href="../worker/login.html">Worker Portal</a>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const errBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');
            errBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating…';

            try {
                await Auth.login({
                    email: document.getElementById('adminEmail').value.trim(),
                    password: document.getElementById('adminPass').value
                }, ['ADMIN', 'MANAGER']);
            } catch (err) {
                errBox.textContent = err.message || 'Authentication failed. Please verify administrator credentials.';
                errBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Authenticate Session`;
            }
        }
    </script>
</body>
</html>
