<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadSafe - Worker Login</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>
    <div class="pwa-container" style="justify-content: center;">
        <div style="padding: 24px; text-align: center;">
            <h1 style="color: var(--primary-teal); margin-bottom: 8px;">Responder Dispatch</h1>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Sign in to accept jobs and manage shop
                dispatch</p>

            <form id="workerLoginForm" onsubmit="handleWorkerLogin(event)">
                <input type="text" class="input-field" id="workerId" placeholder="Worker / Phone Number" required>
                <input type="password" class="input-field" id="password" placeholder="Password" required>

                <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Login to Dashboard</button>
            </form>

            <div style="margin-top: 20px; font-size: 0.85rem;">
                <p>New Service Provider? <a href="register.html" style="color: var(--primary-teal);">Register Shop /
                        Worker</a></p>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        async function handleWorkerLogin(e) {
            e.preventDefault();
            try {
                await Auth.login({
                    email: document.getElementById('workerId').value,
                    password: document.getElementById('password').value,
                    role: 'RESPONDER'
                });
            } catch (err) {
                alert(err.message || 'Unable to sign in.');
            }
        }
    </script>
</body>

</html>
