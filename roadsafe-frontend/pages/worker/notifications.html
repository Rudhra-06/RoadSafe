<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Worker notifications and dispatch broadcasts.">
    <title>Worker Notifications — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<main class="pwa-container">
    <header class="header">
        <a href="dashboard.html" class="header-back" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Responder Broadcasts</span>
        <span style="width:48px;"></span>
    </header>

    <section class="content-body">
        <div class="page-heading">
            <h1>Broadcasts</h1>
            <p>Real-time emergency &amp; dispatch alerts.</p>
        </div>
        <div id="message"></div>
        <div id="notifList">
            <div class="state"><div class="spinner"></div><p>Loading broadcasts…</p></div>
        </div>
    </section>

    <nav class="bottom-nav" aria-label="Worker navigation">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Jobs
        </a>
        <a href="job-history.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            History
        </a>
        <a href="assistant.html" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            AI Help
        </a>
        <a href="notifications.html" class="nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg>
            Alerts
        </a>
        <a href="#" class="nav-item" onclick="Auth.logout(); return false;" style="color:var(--danger-red);">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3m8-9h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Logout
        </a>
    </nav>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();

    async function loadNotifications() {
        const host = document.getElementById('notifList');
        try {
            const notifs = await API.get('/notifications');
            if (!notifs.length) {
                host.innerHTML = '<div class="empty-state">No broadcasts received yet.</div>';
                return;
            }
            host.innerHTML = notifs.map(n => `
                <div class="card" style="border-left: 4px solid ${n.type === 'DISPATCH' ? 'var(--primary-teal)' : 'var(--danger-red)'};">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
                        <h3 style="font-size:.95rem; font-weight:600;">${UI.escape(n.title)}</h3>
                        <small style="color:var(--text-secondary); white-space:nowrap; margin-left:8px;">${new Date(n.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}</small>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">${UI.escape(n.message)}</p>
                </div>
            `).join('');
        } catch (e) {
            UI.alert(document.getElementById('message'), 'Could not load alerts.');
            host.innerHTML = '';
        }
    }

    loadNotifications();
</script>
</body>
</html>
