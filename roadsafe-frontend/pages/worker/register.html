<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanic registration</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><span class="header-title">Mechanic onboarding</span></header><section class="content-body"><div class="page-heading"><h1>Create provider account</h1><p>Skill selections are stored in your responder profile.</p></div><div id="message"></div><form id="registrationForm"><label>Full name</label><input id="fullName" class="input-field" required><label>Email</label><input id="email" type="email" class="input-field" required><label>Phone</label><input id="phone" type="tel" class="input-field" required><label>Password</label><input id="password" type="password" minlength="6" class="input-field" required><label>Provider type</label><select id="type" class="input-field"><option value="CAR_MECHANIC">Car mechanic</option><option value="BIKE_MECHANIC">Bike mechanic</option><option value="TOWING_OPERATOR">Towing operator</option><option value="ROADSIDE_TECHNICIAN">Roadside technician</option></select><label>Shop / provider name</label><input id="shop" class="input-field"><label>Shop address</label><textarea id="address" class="input-field"></textarea><label>Skills / expertise</label><div class="checkbox-grid" id="skills"></div><button class="btn btn-primary" id="submit">Create mechanic account</button></form></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/ui.js"></script><script>const formEl=document.querySelector('#registrationForm'),skillsEl=document.querySelector('#skills'),submitEl=document.querySelector('#submit'),messageEl=document.querySelector('#message');skillsEl.innerHTML=['Engine Repair','Battery Assistance','Tire Repair','Towing','Electrical Repair','AC Repair','Fuel Assistance','General Maintenance'].map(x=>`<label class="check-item"><input type="checkbox" value="${x}">${x}</label>`).join('');formEl.onsubmit=async e=>{e.preventDefault();submitEl.disabled=true;try{await Auth.register({full_name:document.querySelector('#fullName').value,email:document.querySelector('#email').value,phone_number:document.querySelector('#phone').value,password:document.querySelector('#password').value,role:'RESPONDER',responder_type:document.querySelector('#type').value,shop_name:document.querySelector('#shop').value||null,shop_address:document.querySelector('#address').value||null,skills:[...skillsEl.querySelectorAll(':checked')].map(x=>x.value)});UI.alert(messageEl,'Account created. You can now sign in.','success');formEl.reset()}catch(err){UI.alert(messageEl,err.message||'Registration could not be completed.')}finally{submitEl.disabled=false}};</script></body></html>
