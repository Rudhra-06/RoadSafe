<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Parts & Billing</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>
<main class="pwa-container no-bottom-nav">
    <header class="header">
        <a href="dashboard.html" class="header-back" aria-label="Dashboard">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Job Finalization</span>
        <span style="width:48px;"></span>
    </header>

    <section class="content-body" style="text-align:center; padding-top:40px;">
        <div style="width:64px; height:64px; margin:0 auto 16px; background:var(--accent-light); border-radius:50%; display:grid; place-items:center; color:var(--primary-teal);">
            <svg viewBox="0 0 24 24" style="width:36px; height:36px; fill:none; stroke:currentColor; stroke-width:2;"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
        </div>
        <h2 style="font-size:1.3rem; font-weight:700;">Job &amp; Parts Management</h2>
        <p style="color:var(--text-secondary); margin:8px 0 24px;">Please finalize parts and services directly within your active job console.</p>
        <a href="active-job.html" class="btn btn-primary">Go to Active Job Console</a>
    </section>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/auth.js"></script>
<script>
    Auth.guardRoute();
    const activeTicketId = localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
    if (activeTicketId) {
        window.location.href = `active-job.html?id=${encodeURIComponent(activeTicketId)}`;
    }
</script>
</body>

</html>
