<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="View completed jobs and earnings history.">
    <title>Job History — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<main class="pwa-container">
    <header class="header">
        <a href="dashboard.html" class="header-back" aria-label="Back">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Completed Jobs</span>
        <span style="width:48px;"></span>
    </header>

    <section class="content-body">
        <div class="page-heading">
            <h1>Job History</h1>
            <p>Your completed jobs and earnings.</p>
        </div>
        <div id="message"></div>
        <div id="jobList">
            <div class="state"><div class="spinner"></div><p>Loading history…</p></div>
        </div>
    </section>

    <nav class="bottom-nav" aria-label="Worker navigation">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Jobs
        </a>
        <a href="job-history.html" class="nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            History
        </a>
        <a href="assistant.html" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            AI Help
        </a>
        <a href="notifications.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg>
            Alerts
        </a>
        <a href="#" class="nav-item" onclick="Auth.logout(); return false;" style="color:var(--danger-red);">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3m8-9h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Logout
        </a>
    </nav>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();
    const host = document.getElementById('jobList');
    const msg  = document.getElementById('message');

    async function load() {
        try {
            const [tickets, reviews] = await Promise.all([
                API.get('/tickets').catch(() => []),
                API.get('/reviews').catch(() => [])
            ]);
            const reviewMap = {};
            (reviews || []).forEach(r => {
                if (r.ticket_id) reviewMap[r.ticket_id] = r;
            });

            const done = tickets.filter(t => ['COMPLETED','CANCELLED','FAILED'].includes(t.status));
            if (!done.length) {
                host.innerHTML = '<div class="empty-state">No completed jobs yet.</div>';
                return;
            }
            host.innerHTML = done.map(t => {
                const rev = reviewMap[t.id];
                return `
                <article class="job-card">
                    <div class="job-card-header">
                        <h3>${UI.escape(t.description)}</h3>
                        ${UI.statusBadge(t.status)}
                    </div>
                    <p class="muted" style="font-size:.82rem;margin-top:4px;">Ticket #${UI.escape(t.id.slice(0,8))}…</p>
                    <p class="muted" style="font-size:.82rem;">
                        <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px;margin-right:3px;"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                        ${UI.escape(t.vehicle_type || 'Vehicle not recorded')}
                    </p>
                    ${rev ? `
                    <div style="margin-top:10px; padding:8px 10px; background:#f0fdf4; border-radius:6px; border:1px solid #bbf7d0;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                            <strong style="color:#16a34a; font-size:0.85rem;">${'★'.repeat(rev.rating)}${'☆'.repeat(5 - rev.rating)} (${rev.rating}/5)</strong>
                            <small class="muted">${new Date(rev.created_at).toLocaleDateString()}</small>
                        </div>
                        <p style="margin:2px 0 0; font-size:0.82rem; color:var(--text-main);">${UI.escape(rev.comment || 'Verified customer feedback')}</p>
                    </div>
                    ` : ''}
                </article>
                `;
            }).join('');
        } catch (err) {
            UI.alert(msg, err.message || 'Could not load job history.');
            host.innerHTML = '';
        }
    }
    load();
</script>
</body>
</html>
