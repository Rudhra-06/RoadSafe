<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Manage your active roadside assistance job.">
    <title>Active Job — RoadSafe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .status-btn {
            min-height: 56px;
            font-size: 1rem;
            font-weight: 700;
        }
        .info-row {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid var(--border-light);
            font-size: .88rem;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row svg { color: var(--primary-teal); flex-shrink: 0; margin-top: 1px; }
        .info-label { color: var(--text-secondary); font-size: .75rem; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 2px; }
    </style>
</head>
<body>
<main class="pwa-container">
    <header class="header">
        <a href="dashboard.html" class="header-back" aria-label="Back to dashboard">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Active Job</span>
        <span id="statusBadgeWrap" style="flex-shrink:0;"></span>
    </header>

    <section class="content-body">
        <div id="message"></div>

        <!-- Live Navigation Map Card -->
        <div class="nav-map-card" style="position:relative;">
            <div class="nav-stats-bar" id="navStatsBar" style="display:none;">
                <div class="nav-stat-item">
                    <span class="nav-stat-label">Estimated Drive</span>
                    <span class="nav-stat-value highlight" id="routeEta">-- mins</span>
                </div>
                <div class="nav-stat-item">
                    <span class="nav-stat-label">Distance to Customer</span>
                    <span class="nav-stat-value" id="routeDist">-- km</span>
                </div>
                <div class="nav-stat-item" style="align-items: flex-end;">
                    <span class="live-pulse-indicator">
                        <span class="pulse-dot"></span>
                        <span>Navigation</span>
                    </span>
                </div>
            </div>

            <div id="map" style="height: 290px; width: 100%; z-index: 1;"></div>

            <button id="recenterBtn" class="map-recenter-btn" style="display:none; position:absolute; top:58px; right:14px; z-index:1000; background:#ffffff; border:1px solid #cbd5e1; border-radius:20px; padding:7px 14px; font-size:0.78rem; font-weight:700; color:#1d4ed8; box-shadow:0 4px 14px rgba(0,0,0,0.16); cursor:pointer; align-items:center; gap:6px;" onclick="recenterRoute()" title="Fit Route">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#1d4ed8" stroke-width="2.5" style="width:14px;height:14px;min-width:14px;max-width:14px;"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
                <span>Fit Route</span>
            </button>
        </div>

        <div id="jobDetails"></div>

        <!-- Status Controls -->
        <section class="card" id="statusSection" style="display:none;">
            <h2 style="font-size:1rem;font-weight:600;margin-bottom:14px;">Update Status</h2>
            <div id="statusActions"></div>
        </section>

        <!-- Invoice Section -->
        <section class="card" id="invoiceSection" style="display:none;">
            <h2 style="font-size:1rem;font-weight:600;margin-bottom:14px;">Complete Job &amp; Invoice</h2>

            <div class="form-group">
                <label class="form-label" for="serviceSelect">Service Delivered</label>
                <select id="serviceSelect" class="input-field"></select>
            </div>

            <div class="form-group">
                <label class="form-label">Parts Used</label>
                <div id="partsGrid" class="checkbox-grid"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="workNotes">Work Notes</label>
                <textarea id="workNotes" class="input-field" rows="3" placeholder="Describe what was done…"></textarea>
            </div>

            <button class="btn btn-success status-btn" id="completeBtn">
                <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
                Generate Invoice &amp; Complete
            </button>
        </section>
    </section>

    <nav class="bottom-nav" aria-label="Worker navigation">
        <a href="dashboard.html" class="nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Jobs
        </a>
        <a href="job-history.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
            History
        </a>
        <a href="assistant.html" class="nav-item">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            AI Help
        </a>
        <a href="notifications.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg>
            Alerts
        </a>
        <a href="#" class="nav-item" onclick="Auth.logout(); return false;" style="color:var(--danger-red);">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3m8-9h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
            Logout
        </a>
    </nav>
</main>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/offline.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/ui.js"></script>
<script>
    Auth.guardRoute();

    const id = new URLSearchParams(location.search).get('id')
            || localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);

    const msgEl       = document.getElementById('message');
    const jobDetails  = document.getElementById('jobDetails');
    const statusSec   = document.getElementById('statusSection');
    const invoiceSec  = document.getElementById('invoiceSection');
    const statusBadge = document.getElementById('statusBadgeWrap');
    const completeBtn = document.getElementById('completeBtn');

    let leafMap = null;
    let custMarker = null;
    let workMarker = null;
    let routeLayerGroup = null;
    let currentRouteBounds = null;

    // Customer breakdown vehicle marker (Car Emoji/Pic + Big Endpoint Black Dot)
    const customerIcon = L.divIcon({
        className: 'custom-marker-customer',
        html: `<div class="customer-vehicle-badge" title="Customer Breakdown Location">
                  <span style="font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center;">🚗</span>
               </div>
               <div class="endpoint-dot"></div>`,
        iconSize: [36, 54],
        iconAnchor: [18, 43]
    });

    // Worker technician marker (Man Mechanic Emoji/Pic + Pulse + Big Endpoint Black Dot)
    const workerIcon = L.divIcon({
        className: 'custom-marker-worker',
        html: `<div class="worker-radar-ring"></div>
               <div class="worker-avatar-badge" title="Your Location">
                  <span style="font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center;">👨‍🔧</span>
               </div>
               <div class="endpoint-dot"></div>`,
        iconSize: [44, 54],
        iconAnchor: [22, 43]
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function recenterRoute() {
        if (leafMap && currentRouteBounds) {
            leafMap.fitBounds(currentRouteBounds, { padding: [50, 50], maxZoom: 16 });
        }
    }

    async function fetchAndDrawRoute(cLat, cLng, wLat, wLng) {
        if (!leafMap) return;

        if (!routeLayerGroup) {
            routeLayerGroup = L.layerGroup().addTo(leafMap);
        } else {
            routeLayerGroup.clearLayers();
        }

        let straightDistKm = calcDistance(cLat, cLng, wLat, wLng);
        if (straightDistKm < 0.25) {
            wLat = cLat + 0.025;
            wLng = cLng + 0.022;
            straightDistKm = calcDistance(cLat, cLng, wLat, wLng);
        }

        // Ensure markers sit directly on the route endpoints with high z-index
        if (custMarker) {
            custMarker.setLatLng([cLat, cLng]);
            custMarker.setZIndexOffset(2000);
        }
        if (workMarker) {
            workMarker.setLatLng([wLat, wLng]);
            workMarker.setZIndexOffset(2000);
        }

        let roadDistKm = (straightDistKm * 1.25).toFixed(1);
        let durationMins = Math.max(2, Math.round((roadDistKm / 35) * 60));
        let latlngs = [[wLat, wLng], [cLat, cLng]];

        try {
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${wLng},${wLat};${cLng},${cLat}?overview=full&geometries=geojson`;
            const res = await fetch(osrmUrl);
            if (res.ok) {
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coords = route.geometry.coordinates; // [lng, lat]
                    latlngs = coords.map(c => [c[1], c[0]]);
                    roadDistKm = (route.distance / 1000).toFixed(1);
                    durationMins = Math.max(1, Math.round(route.duration / 60));
                }
            }
        } catch (e) {
            console.log('Worker OSRM routing fallback used:', e);
        }

        let etaFormatted = durationMins < 60 ? `${durationMins} min` : `${Math.floor(durationMins/60)} hr ${durationMins%60} min`;

        const navBar = document.getElementById('navStatsBar');
        const routeEta = document.getElementById('routeEta');
        const routeDist = document.getElementById('routeDist');
        const recenterBtn = document.getElementById('recenterBtn');

        if (navBar) navBar.style.display = 'flex';
        if (routeEta) routeEta.textContent = etaFormatted;
        if (routeDist) routeDist.textContent = `${roadDistKm} km`;
        if (recenterBtn) recenterBtn.style.display = 'inline-flex';

        // Dark outer boundary
        const casingPolyline = L.polyline(latlngs, {
            color: '#1e40af',
            weight: 7,
            opacity: 0.8,
            lineCap: 'round',
            lineJoin: 'round'
        });

        // Vibrant blue route
        const corePolyline = L.polyline(latlngs, {
            color: '#2563eb',
            weight: 5,
            opacity: 0.95,
            lineCap: 'round',
            lineJoin: 'round'
        });
        
        routeLayerGroup.addLayer(casingPolyline);
        routeLayerGroup.addLayer(corePolyline);

        // Place ETA Badge Pill at midpoint of route
        const midIdx = Math.floor(latlngs.length / 2);
        const midPoint = latlngs[midIdx] || [(cLat + wLat) / 2, (cLng + wLng) / 2];

        const etaBadgeIcon = L.divIcon({
            className: 'route-eta-marker',
            html: `<div class="route-eta-pill" style="background:#1a73e8; color:#ffffff; font-size:12px; font-weight:700; padding:3px 8px; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,0.3); border:1.5px solid #ffffff; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; line-height:1;">
                      <svg viewBox="0 0 24 24" style="width:12px;height:12px;min-width:12px;max-width:12px;fill:#fff;display:inline-block;" width="12" height="12"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                      <span>${etaFormatted}</span>
                   </div>`,
            iconSize: [80, 24],
            iconAnchor: [40, 12]
        });

        const etaMarker = L.marker(midPoint, { icon: etaBadgeIcon, interactive: false });
        routeLayerGroup.addLayer(etaMarker);

        currentRouteBounds = L.latLngBounds(latlngs);
        leafMap.fitBounds(currentRouteBounds, { padding: [50, 50], maxZoom: 16 });
    }

    function updateMap(cLat, cLng, wLat = null, wLng = null) {
        if (!leafMap) {
            leafMap = L.map('map').setView([cLat, cLng], 14);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(leafMap);
            custMarker = L.marker([cLat, cLng], { icon: customerIcon, zIndexOffset: 2000 }).addTo(leafMap)
                .bindPopup('<b>Customer Breakdown Location</b>');
        } else {
            custMarker.setLatLng([cLat, cLng]);
            custMarker.setZIndexOffset(2000);
        }

        if (wLat !== null && wLng !== null) {
            if (!workMarker) {
                workMarker = L.marker([wLat, wLng], { icon: workerIcon, zIndexOffset: 2000 }).addTo(leafMap)
                    .bindPopup('<b>👨‍🔧 Your Current Location</b>');
            } else {
                workMarker.setLatLng([wLat, wLng]);
                workMarker.setZIndexOffset(2000);
            }

            fetchAndDrawRoute(cLat, cLng, wLat, wLng);
        } else {
            leafMap.setView([cLat, cLng], 14);
        }
    }

    // Next status map
    const NEXT = {
        ACCEPTED:   ['EN_ROUTE',    'Set En Route',    'btn-primary'],
        EN_ROUTE:   ['ARRIVED',     'Mark Arrived',    'btn-primary'],
        ARRIVED:    ['IN_SERVICE',  'Start Service',   'btn-success'],
        IN_SERVICE: ['COMPLETED',   'Mark Service Resolved', 'btn-success'],
    };

    // Isolated DEV/TESTING GPS Fallback
    const DEV_FALLBACK_COORDS = { latitude: 11.0168, longitude: 76.9558 };
    const ENABLE_DEV_FALLBACK = true;

    function startLocationTracking(cLat, cLng) {
        if (!navigator.geolocation) {
            if (ENABLE_DEV_FALLBACK) {
                API.patch('/responders/location', DEV_FALLBACK_COORDS).catch(() => {});
                updateMap(cLat, cLng, DEV_FALLBACK_COORDS.latitude, DEV_FALLBACK_COORDS.longitude);
            }
            return;
        }
        navigator.geolocation.watchPosition(async position => {
            try {
                const wLat = position.coords.latitude;
                const wLng = position.coords.longitude;
                await API.patch('/responders/location', { latitude: wLat, longitude: wLng });
                updateMap(cLat, cLng, wLat, wLng);
            } catch (err) {
                console.error('Location update failed:', err);
            }
        }, () => {
            if (ENABLE_DEV_FALLBACK) {
                API.patch('/responders/location', DEV_FALLBACK_COORDS).catch(() => {});
                updateMap(cLat, cLng, DEV_FALLBACK_COORDS.latitude, DEV_FALLBACK_COORDS.longitude);
            }
        }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 10000 });
    }

    if (!id) { location.href = 'dashboard.html'; }

    async function load() {
        try {
            const t = await API.get('/tickets/' + id);
            statusBadge.innerHTML = UI.statusBadge(t.status);

            updateMap(t.latitude, t.longitude);
            startLocationTracking(t.latitude, t.longitude);

            jobDetails.innerHTML = `
            <section class="card">
                <div class="info-row">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1-5 5L3 18l3 3 6.7-6.7a4 4 0 0 1 5-5l-3 3-2-2 3-3z"/></svg>
                    <div>
                        <div class="info-label">Issue</div>
                        <strong>${UI.escape(t.description)}</strong>
                    </div>
                </div>
                <div class="info-row">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                    <div>
                        <div class="info-label">Vehicle</div>
                        <span>${UI.escape(t.vehicle_type || 'Not specified')}</span>
                    </div>
                </div>
                <div class="info-row">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1.1.4 2.1.8 3.1a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c1 .4 2 .7 3.1.8a2 2 0 0 1 1.6 1.7z"/></svg>
                    <div>
                        <div class="info-label">Customer Contact</div>
                        <span>${UI.escape(t.contact_phone || 'Not provided')}</span>
                    </div>
                </div>
                <div class="info-row">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <div>
                        <div class="info-label">Location</div>
                        <span>${(t.latitude||0).toFixed(5)}, ${(t.longitude||0).toFixed(5)}</span>
                    </div>
                </div>
            </section>`;

            const nextStep = NEXT[t.status];
            if (nextStep) {
                statusSec.style.display = 'block';
                document.getElementById('statusActions').innerHTML = `
                    <button class="btn ${nextStep[2]} status-btn" onclick="changeStatus('${nextStep[0]}')">
                        <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        ${nextStep[1]}
                    </button>`;
            } else if (['COMPLETED','CANCELLED','FAILED'].includes(t.status)) {
                statusSec.style.display = 'block';
                document.getElementById('statusActions').innerHTML = `<p class="muted">This job is ${t.status.toLowerCase()}. Assistance lifecycle complete.</p>`;
            } else {
                statusSec.style.display = 'none';
            }

            if (t.status === 'IN_SERVICE') {
                invoiceSec.style.display = 'block';
                await loadInvoiceOptions();
            } else {
                invoiceSec.style.display = 'none';
            }
        } catch (err) {
            UI.alert(msgEl, err.message || 'This job could not be loaded.');
        }
    }

    async function changeStatus(newStatus) {
        try {
            await API.patch('/tickets/' + id + '/status', { status: newStatus });
            await load();
        } catch (err) {
            UI.alert(msgEl, err.message || 'Status could not be updated.');
        }
    }

    async function loadInvoiceOptions() {
        const [services, allParts] = await Promise.all([API.get('/services'), API.get('/parts')]);
        const svc = document.getElementById('serviceSelect');
        const parts = document.getElementById('partsGrid');
        svc.innerHTML = services.map(s => `<option value="${s.id}">${UI.escape(s.name)} — ${Number(s.base_price).toLocaleString(undefined,{style:'currency',currency:'INR'})}</option>`).join('');
        parts.innerHTML = allParts.filter(p => p.stock_quantity > 0).map(p =>
            `<label class="check-item">
                <input type="checkbox" value="${p.id}">
                ${UI.escape(p.name)} (${p.stock_quantity})
            </label>`
        ).join('');
    }

    completeBtn.addEventListener('click', async () => {
        completeBtn.disabled = true;
        completeBtn.textContent = 'Generating invoice…';
        try {
            const partsUsed = [...document.getElementById('partsGrid').querySelectorAll(':checked')]
                .map(x => ({ part_id: x.value, quantity: 1 }));
            const invoice = await API.post(`/billing/tickets/${id}/complete`, {
                service_id: document.getElementById('serviceSelect').value,
                parts:      partsUsed,
                notes:      document.getElementById('workNotes').value || null
            });
            localStorage.removeItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);
            location.href = 'job-history.html';
        } catch (err) {
            UI.alert(msgEl, err.message || 'Invoice could not be generated.');
            completeBtn.disabled = false;
            completeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg> Generate Invoice &amp; Complete`;
        }
    });

    load();
</script>
</body>
</html>
