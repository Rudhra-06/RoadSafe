<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Assistance Job</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>
    <div class="pwa-container">
        <div class="header">
            <span class="header-title">Job #RS-4921</span>
            <span class="badge badge-danger">CRITICAL</span>
        </div>

        <div class="content-body">
            <!-- Customer Information Block -->
            <div class="card">
                <h3>Customer Details</h3>
                <p><strong>Name:</strong> Sarah Jenkins</p>
                <p><strong>Vehicle:</strong> 2021 Toyota Camry (Front-Right Tyre)</p>
                <p><strong>Location:</strong> NH-44, Mile Marker 112</p>
                <a href="tel:5550192" class="btn btn-outline" style="margin-top: 10px; padding: 8px;">📞 Call Customer
                    Directly</a>
            </div>

            <!-- State Transition Controls -->
            <div class="card">
                <h3>Execution Lifecycle</h3>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                    <button class="btn btn-primary" id="btnEnRoute" onclick="updateJobState('EN_ROUTE')">Set Status: En
                        Route</button>
                    <button class="btn btn-outline" id="btnArrived" onclick="updateJobState('ARRIVED')">Set Status:
                        Arrived</button>
                    <button class="btn btn-outline" id="btnService" onclick="updateJobState('IN_SERVICE')">Start
                        Assistance Service</button>
                </div>
            </div>

            <button class="btn btn-primary" style="background: #059669;"
                onclick="window.location.href='parts-entry.html'">
                Complete Service & Enter Bill →
            </button>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        async function updateJobState(status) {
            await API.patch('/tickets/ticket_001/status', { status });
            alert(`Job state updated to: ${status}`);
        }
    </script>
</body>

</html>
