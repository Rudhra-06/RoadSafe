<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active job</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><a href="dashboard.html">‹</a><span class="header-title">Active job</span><span id="badge"></span></header><section class="content-body"><div id="message"></div><div id="job"></div><section class="card"><h3>Update job status</h3><div id="actions"></div></section><section class="card" id="record" hidden><h3>Complete and invoice</h3><label>Service delivered</label><select id="service" class="input-field"></select><label>Parts used</label><div id="parts" class="checkbox-grid"></div><label>Work notes</label><textarea id="notes" class="input-field"></textarea><button class="btn btn-primary" id="complete">Generate invoice and complete job</button></section></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>const id=new URLSearchParams(window.location.search).get('id')||localStorage.getItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID),next={ACCEPTED:['EN_ROUTE','Set en route'],EN_ROUTE:['ARRIVED','Mark arrived'],ARRIVED:['IN_SERVICE','Start service']};async function load(){if(!id){window.location.href='dashboard.html';return}try{const t=await API.get('/tickets/'+id);badge.innerHTML=UI.statusBadge(t.status);job.innerHTML=`<section class="card"><h3>${UI.escape(t.description)}</h3><p class="muted">Customer contact: ${UI.escape(t.contact_phone||'Not provided')}</p><p class="muted">Vehicle: ${UI.escape(t.vehicle_type)}</p><p class="muted">Location: ${t.latitude.toFixed(5)}, ${t.longitude.toFixed(5)}</p></section>`;const n=next[t.status];actions.innerHTML=n?`<button class="btn btn-primary" onclick="changeStatus('${n[0]}')">${n[1]}</button>`:'<p class="muted">No further status action is available.</p>';record.hidden=t.status!=='IN_SERVICE';if(t.status==='IN_SERVICE')await loadRecord()}catch(e){UI.alert(message,'This job could not be loaded.')}}async function changeStatus(s){try{await API.patch('/tickets/'+id+'/status',{status:s});load()}catch(e){UI.alert(message,e.message||'Status could not be updated.')}}async function loadRecord(){const [services,allParts]=await Promise.all([API.get('/services'),API.get('/parts')]);service.innerHTML=services.map(s=>`<option value="${s.id}">${UI.escape(s.name)} — ${s.base_price}</option>`).join('');parts.innerHTML=allParts.filter(p=>p.stock_quantity>0).map(p=>`<label class="check-item"><input type="checkbox" value="${p.id}">${UI.escape(p.name)} (${p.stock_quantity})</label>`).join('')}complete.onclick=async()=>{complete.disabled=true;try{const partsUsed=[...parts.querySelectorAll(':checked')].map(x=>({part_id:x.value,quantity:1}));const invoice=await API.post(`/billing/tickets/${id}/complete`,{service_id:service.value,parts:partsUsed,notes:notes.value||null});localStorage.removeItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID);window.location.href='../customer/payment.html?invoice_id='+invoice.id}catch(e){complete.disabled=false;UI.alert(message,e.message||'Invoice could not be generated.')}};load();</script></body></html>
