<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanic dashboard</title><link rel="stylesheet" href="../../css/styles.css"></head><body><main class="pwa-container"><header class="header"><span class="header-title">Mechanic dashboard</span><label class="availability"><input id="available" type="checkbox"> Available</label></header><section class="content-body"><div class="page-heading"><h1 id="welcome">Your jobs</h1><p id="availabilityText">Loading availability…</p></div><div id="message"></div><div id="jobs"></div></section></main><script src="../../js/config.js"></script><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script>const host=jobs;async function load(){UI.loading(host,'Loading assigned jobs…');try{const p=await API.get('/responders/me');welcome.textContent=p.shop_name||'Your jobs';available.checked=p.is_available&&p.is_online;availabilityText.textContent=available.checked?'You are available for dispatch.':'You are unavailable for dispatch.';const tickets=await API.get('/tickets'),cards=tickets.filter(t=>t.assignments.some(a=>a.status==='OFFERED')||['ACCEPTED','EN_ROUTE','ARRIVED','IN_SERVICE'].includes(t.status));host.innerHTML=cards.length?cards.map(t=>`<article class="card"><div style="display:flex;justify-content:space-between"><h3>${UI.escape(t.description)}</h3>${UI.statusBadge(t.status)}</div><p class="muted">${UI.escape(t.vehicle_type)} · ${t.latitude.toFixed(5)}, ${t.longitude.toFixed(5)}</p>${t.assignments.some(a=>a.status==='OFFERED')?`<button class="btn btn-primary" onclick="respond('${t.id}',true)">Accept job</button><button class="btn btn-outline" onclick="respond('${t.id}',false)">Decline</button>`:`<a class="btn btn-primary" href="active-job.html?id=${t.id}">Open job</a>`}</article>`).join(''):'<div class="empty-state">No incoming or active jobs right now.</div>'}catch(e){UI.alert(message,'Jobs could not be loaded. Please retry.');host.innerHTML=''}}available.onchange=async()=>{available.disabled=true;try{await API.patch('/responders/availability',{is_available:available.checked,is_online:available.checked});availabilityText.textContent=available.checked?'You are available for dispatch.':'You are unavailable for dispatch.'}catch(e){available.checked=!available.checked;UI.alert(message,e.message||'Availability could not be updated.')}finally{available.disabled=false}};async function respond(id,accepted){try{await API.post(`/tickets/${id}/assignment/respond`,{accepted});if(accepted){localStorage.setItem(CONFIG.STORAGE_KEYS.ACTIVE_TICKET_ID,id);location.href='active-job.html?id='+id}else load()}catch(e){UI.alert(message,e.message||'Job response failed.')}}load();</script></body></html>
